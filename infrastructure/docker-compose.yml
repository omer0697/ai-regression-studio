# AI Regression Studio — local development infrastructure.
# Usage:
#   cd infrastructure
#   docker compose up -d          # PostgreSQL + MinIO (+ ars-artifacts bucket)
#
# The application services (api/web/worker) run on the host by default.
# For a fully containerized stack:
#   docker compose -f docker-compose.yml -f docker-compose.full.yml up -d --build
#
# NOTE ON MINIO IMAGES: MinIO's official images were removed from Docker Hub,
# and quay.io now rejects anonymous pulls. This development compose uses the
# frozen `bitnamilegacy/minio` mirror, which is fine for local evidence
# storage. For shared/company environments, mirror the MinIO image into an
# internal registry and pin a release tag.

name: ai-regression-studio

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ars}
      POSTGRES_USER: ${POSTGRES_USER:-ars}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ars}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ars} -d ${POSTGRES_DB:-ars}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ars-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ars-minio-secret}
      # Evidence bucket (screenshots/traces/PDFs — used from Phase 2 on).
      MINIO_DEFAULT_BUCKETS: ars-artifacts
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  minio-data:
