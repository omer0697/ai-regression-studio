<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>KAP Yeni Nesil Portal (React Iframe Shell)</title>
  <style>
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; background: #f0f2f5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .shell-header { background: #0f172a; color: #fff; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; }
    .shell-body { display: flex; flex: 1; min-height: 0; }
    .shell-sidebar { width: 210px; background: #1e293b; color: #cbd5e1; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .nav-pill { padding: 8px 10px; border-radius: 6px; background: #2563eb; color: #fff; font-weight: 500; }
    .shell-main { flex: 1; display: flex; flex-direction: column; background: #fff; }
    .iframe-bar { background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 5px 12px; font-size: 11px; color: #64748b; display: flex; justify-content: space-between; }
    iframe { flex: 1; width: 100%; border: none; background: #fff; }
  </style>
</head>
<body>
  <div class="shell-header" data-ars-shell-ignore="true">
    <div><strong>KAP React Shell</strong> — Mikro-Frontend / Iframe Container</div>
    <div id="activeRouteBadge">Route: /kpy68</div>
  </div>
  <div class="shell-body">
    <div class="shell-sidebar" data-ars-shell-ignore="true">
      <div style="font-size:11px;opacity:0.7;">NAVİGASYON</div>
      <div class="nav-pill">KPY68 — Parametre Tanımları</div>
    </div>
    <div class="shell-main">
      <div class="iframe-bar" data-ars-shell-ignore="true">
        <span>Container: <code>iframe#reactScreenFrame</code></span>
        <span>src: react-kpy68.html</span>
      </div>
      <iframe id="reactScreenFrame" name="reactScreenFrame" src="react-kpy68.html" title="React KPY68 Screen"></iframe>
    </div>
  </div>
</body>
</html>
