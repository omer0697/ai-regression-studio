<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>KAP GWT — Giriş (Fixture)</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; font-size: 12px; background: #eef1f6; }
    .login-box { width: 340px; margin: 70px auto; background: #fff; border: 1px solid #b6c4dd; padding: 18px; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .login-box h3 { margin-top: 0; color: #2d4d7f; }
    input { border: 1px solid #7f9db9; padding: 5px; width: 260px; margin: 4px 0; }
    button { padding: 5px 14px; margin-top: 8px; cursor: pointer; }
    .hint-box { margin-top: 12px; padding: 8px; background: #f3f7fd; border: 1px dashed #9cb3d5; font-size: 11px; color: #345; }
    .error { color: #c00; display: none; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h3>KAP — Kullanıcı Girişi</h3>
    <form id="loginForm">
      <div><input type="text" name="username" id="usernameInput" placeholder="Kullanıcı adı"></div>
      <div><input type="password" name="password" id="passwordInput" placeholder="Şifre"></div>
      <div class="error" id="errBox">Kullanıcı adı veya şifre hatalı.</div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button type="submit" class="gwt-Button">Giriş Yap</button>
        <button type="button" id="quickFillBtn" style="font-size:11px;">Demo Bilgileri Doldur</button>
      </div>
    </form>
    <div class="hint-box">
      <strong>Manuel Giriş Testi:</strong><br>
      Kullanıcı: <code>testuser</code> | Şifre: <code>test-pass-123</code><br>
      Giriş yaptıktan sonra oturum çerezi oluşturulur ve hedef ekran açılır.
    </div>
  </div>
  <script>
    document.getElementById("quickFillBtn").addEventListener("click", function () {
      document.getElementById("usernameInput").value = "testuser";
      document.getElementById("passwordInput").value = "test-pass-123";
    });

    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();
      var password = this.elements["password"].value;
      if (password === "test-pass-123") {
        document.cookie = "KAP_AUTH_SESSION=authenticated-testuser; path=/; SameSite=Lax";
        try {
          localStorage.setItem("kap_logged_in_user", "testuser");
        } catch (e) {}
        var params = new URLSearchParams(window.location.search);
        var next = params.get("next") || "gwt-iframe-shell.html#KPY68";
        window.location.assign(next);
      } else {
        document.getElementById("errBox").style.display = "block";
      }
    });
  </script>
</body>
</html>
