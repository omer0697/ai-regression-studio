spring:
  application:
    name: ars-api

  datasource:
    url: ${ARS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ars}
    username: ${ARS_DATASOURCE_USERNAME:ars}
    password: ${ARS_DATASOURCE_PASSWORD:ars}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only verifies the mapping.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${ARS_API_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        # Namespaced so other localhost apps can never overwrite this session.
        name: ARS-SESSIONID

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  seed:
    admin-username: ${ARS_SEED_ADMIN_USERNAME:admin}
    admin-password: ${ARS_SEED_ADMIN_PASSWORD:admin123!}
  worker:
    # Leave empty to keep the platform usable without the browser worker;
    # executions then finish honestly as NOT_SUPPORTED/WORKER_NOT_CONFIGURED.
    base-url: ${ARS_WORKER_BASE_URL:}
  cors:
    # Pattern-based list. Browsers attach Origin to every POST (same-origin
    # included), so the dev proxy port must be allowed; localhost:* covers
    # all dev ports. Production tightens this via ARS_WEB_ORIGINS.
    allowed-origins: ${ARS_WEB_ORIGINS:http://localhost:*,http://127.0.0.1:*}

logging:
  level:
    com.ars.api: INFO
