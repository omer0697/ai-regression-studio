spring:
  application:
    name: ars-api
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 60MB

  datasource:
    url: ${ARS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ars}
    username: ${ARS_DATASOURCE_USERNAME:ars}
    password: ${ARS_DATASOURCE_PASSWORD:ars}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only verifies the mapping.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${ARS_API_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        # Namespaced so other localhost apps can never overwrite this session.
        name: ARS-SESSIONID

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  seed:
    admin-username: ${ARS_SEED_ADMIN_USERNAME:admin}
    admin-password: ${ARS_SEED_ADMIN_PASSWORD:admin123!}
  worker:
    # Leave empty to keep the platform usable without the browser worker;
    # executions then finish honestly as NOT_SUPPORTED/WORKER_NOT_CONFIGURED.
    base-url: ${ARS_WORKER_BASE_URL:}
  cors:
    # Pattern-based list. Browsers attach Origin to every POST (same-origin
    # included), so the dev proxy port must be allowed; localhost:* covers
    # all dev ports. Production tightens this via ARS_WEB_ORIGINS.
    allowed-origins: ${ARS_WEB_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  internal:
    # Shared secret for the worker -> API callback channel (/api/internal/**).
    # Set a strong value before deploying beyond a local machine.
    token: ${ARS_INTERNAL_TOKEN:ars-dev-internal-token}
  storage:
    # Evidence storage (screenshots / traces / logs / PDFs).
    # mode=s3          -> MinIO/S3-compatible (endpoint, keys, bucket)
    # mode=filesystem  -> plain local directory (dir); no Docker needed.
    # The sqlite profile switches the default to filesystem.
    mode: ${ARS_STORAGE_MODE:s3}
    endpoint: ${ARS_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${ARS_MINIO_ACCESS_KEY:ars-minio}
    secret-key: ${ARS_MINIO_SECRET_KEY:ars-minio-secret}
    bucket: ${ARS_MINIO_BUCKET:ars-artifacts}
    dir: ${ARS_STORAGE_DIR:./data/artifacts}
  ai:
    # OpenAI-compatible company-hosted DeepSeek adapter. Leave blank to keep the
    # platform fully usable without AI; AI features then report
    # AI_NOT_CONFIGURED honestly instead of faking results.
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}
    api-key: ${AI_API_KEY:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
  confluence:
    # Requirement source. Optional: the requirements page reports
    # CONFLUENCE_NOT_CONFIGURED honestly when blank.
    base-url: ${ARS_CONFLUENCE_BASE_URL:}
    token: ${ARS_CONFLUENCE_TOKEN:}

logging:
  level:
    com.ars.api: INFO
